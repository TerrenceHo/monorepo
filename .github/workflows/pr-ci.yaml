name: Pull Request CI
on:
  pull_request:
    branches:
      - master
env:
  BUILD_BUDDY_API_KEY: ${{ secrets.BUILD_BUDDY_API_KEY }}
jobs:
  test:
    # virtual environments: https://github.com/actions/virtual-environments
    runs-on: ubuntu-22.04
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, which is the CWD for
      # the rest of the steps
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
        with:
          make-default: false
      - name: Show available linkers
        run: |
          echo "PATH ld candidates:"
          for l in ld ld.bfd ld.gold ld.lld ld.mold; do
            command -v $l && $l --version | head -1 || echo "$l: not found"
          done
          ls /usr/bin/ld.lld* 2>/dev/null || echo "no ld.lld* in /usr/bin"
      # build
      - name: builds the code
        run: bazel build --config=pr-ci --remote_header=x-buildbuddy-api-key=${BUILD_BUDDY_API_KEY} //...
      # test
      - name: tests the code
        run: bazel test --config=pr-ci --remote_header=x-buildbuddy-api-key=${BUILD_BUDDY_API_KEY} //...

